plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-parcelize'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    compileSdkVersion 33
    buildToolsVersion "33"

    defaultConfig {
        applicationId "com.mstech.lifeline"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 29
        versionName "1.29"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    android {
        buildFeatures {
            viewBinding = true
        }
    }
}

dependencies {

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.3.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    //Utils
    implementation 'com.blankj:utilcodex:1.31.1'

    //Retrofit and GSON
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.2.1'

    //Kotlin Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.3.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.3.0"

    //Image Loader
    implementation 'com.github.bumptech.glide:glide:4.11.0'
    // Screen TextSizes handling
    implementation 'com.intuit.sdp:sdp-android:1.1.1'
    //CardView
    implementation "androidx.cardview:cardview:1.0.0"
    //lifecyclescope
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.2.0"
    implementation 'androidx.navigation:navigation-fragment:2.3.3'
    implementation 'androidx.navigation:navigation-ui:2.3.3'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.2.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.2.0'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.3.3'
    implementation 'androidx.navigation:navigation-ui-ktx:2.3.3'
    implementation 'com.android.volley:volley:1.2.1'
    implementation("androidx.activity:activity-ktx:1.2.0")
    //Country Picker
    implementation 'com.github.gbksoft:GBKCountryCodePicker:v1.0.1'
    //Youtube Android Player API Jar dependency
    implementation files('libs/YouTubeAndroidPlayerApi.jar')
    //location
    implementation 'com.google.android.gms:play-services-location:17.1.0'
    implementation 'com.google.android.libraries.places:places:2.4.0'
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'de.hdodenhof:circleimageview:3.0.1'
//    implementation 'com.theartofdev.edmodo:android-image-cropper:2.8.+'
    implementation 'com.github.dhaval2404:imagepicker-support:1.7.1'
    implementation 'com.google.firebase:firebase-messaging:23.1.1'
    implementation(platform("com.google.firebase:firebase-bom:33.1.2"))
    implementation("com.google.firebase:firebase-crashlytics")
    implementation("com.google.firebase:firebase-analytics")
//    implementation 'com.github.CanHub:Android-Image-Cropper:2.1.1'
    implementation 'com.github.barteksc:android-pdf-viewer:2.8.2'

    //circular image view
    implementation 'de.hdodenhof:circleimageview:3.1.0'

    def camerax_version = "1.1.0-beta01"
    // The following line is optional, as the core library is included indirectly by camera-camera2
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-video:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    implementation "androidx.concurrent:concurrent-futures-ktx:1.1.0"
    implementation 'com.github.safetysystemtechnology:android-shake-detector:v1.2'
    //Location library
    implementation 'com.github.BirjuVachhani:locus-android:4.0.1'

}